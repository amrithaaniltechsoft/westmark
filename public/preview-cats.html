<!DOCTYPE html>
<html>

<head>
  <style>
    body {
      background: #333;
      color: white;
      font-family: sans-serif;
      display: flex;
      gap: 20px;
      padding: 20px;
    }

    .card {
      background: white;
      color: black;
      padding: 10px;
      border-radius: 8px;
      text-align: center;
    }

    .circle {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      overflow: hidden;
      background: #efeeeb;
      position: relative;
      border: 2px solid red;
    }

    .circle img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .circle-contain img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
</head>

<body>

  <div class="card">
    <p><b>cover</b></p>
    <div class="circle">
      <img src="/categories/Aluminium%20Products%20%26%20Extrusions.png" />
    </div>
    <p><b>contain</b></p>
    <div class="circle circle-contain">
      <img src="/categories/Aluminium%20Products%20%26%20Extrusions.png" />
    </div>
    <p style="font-size: 11px;">Aluminium Products & Extrusions.png</p>
  </div>

  <div class="card">
    <p><b>cover</b></p>
    <div class="circle">
      <img src="/categories/Metal%20Products.png" />
    </div>
    <p><b>contain</b></p>
    <div class="circle circle-contain">
      <img src="/categories/Metal%20Products.png" />
    </div>
    <p style="font-size: 11px;">Metal products.png</p>
  </div>

  <div class="card">
    <p><b>cover</b></p>
    <div class="circle">
      <img src="/categories/Plastics%20(HDPE%20%26%20Others).png" />
    </div>
    <p><b>contain</b></p>
    <div class="circle circle-contain">
      <img src="/categories/Plastics%20(HDPE%20%26%20Others).png" />
    </div>
    <p style="font-size: 11px;">Plastics (HDPE & Others).png</p>
  </div>

  <div class="card">
    <p><b>cover</b></p>
    <div class="circle">
      <img src="/categories/AAC%20Blocks.png" />
    </div>
    <p><b>contain</b></p>
    <div class="circle circle-contain">
      <img src="/categories/AAC%20Blocks.png" />
    </div>
    <p style="font-size: 11px;">AAC Blocks.png</p>
  </div>

  <div class="card">
    <p><b>cover</b></p>

      <img src="/categories/Spices.png" />
    </div>
    <p><b>contain</b></p>
    <div class="circle circle-contain">
      <img src="/categories/Spices.png" />

    <p style="font-size: 11px;">Spices.png</p>
  </div>

</body>

</html>
